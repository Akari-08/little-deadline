[platformio]
default_envs = freenove_esp32_wrover
build_dir = C:/Users/aaron/.platformio/build/Lil_Deadline_firmware

[env:freenove_esp32_wrover]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.33/platform-espressif32.zip
board = esp-wrover-kit
framework = arduino
build_type = release

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
board_build.partitions = no_ota.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 2097152

upload_speed = 115200

monitor_speed = 115200
monitor_eol = LF
monitor_echo = no
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw

lib_deps =
    links2004/WebSockets@2.7.2
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit MPU6050@2.2.9
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit BMP280 Library@3.0.0
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15